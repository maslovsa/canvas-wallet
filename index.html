<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#08090b" />
  <meta name="color-scheme" content="dark light" />
  <title>Token UI Studio</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main id="app">
    <div id="status-banner" class="status-banner" role="status"></div>

    <div id="gallery-view" class="gallery-view">
      <header class="gallery-header">
        <div id="gallery-brand" class="brand-mark" aria-hidden="true"></div>
        <h1>Token UI Studio</h1>
        <p>Pick a token list to preview as a wallet and edit, or upload your own registry.json.</p>
      </header>
      <div id="gallery-cards" class="gallery-cards"></div>
      <div class="gallery-upload">
        <label id="upload-label" class="upload-btn" for="upload-input"><span>Upload your own list</span></label>
        <input id="upload-input" type="file" accept="application/json,.json" hidden />
      </div>
    </div>

    <div id="studio-view" class="studio-view" hidden>
      <h1 class="sr-only">Token UI Studio</h1>
      <header class="topbar">
        <button id="back-to-gallery" class="icon-btn is-ghost" type="button"></button>
        <span id="topbar-sep" class="topbar-sep" aria-hidden="true"></span>
        <div id="registry-source-banner" class="registry-source-banner"></div>
        <div class="topbar-actions">
          <button id="download-list-btn" class="icon-btn" type="button"></button>
        </div>
      </header>

      <div class="app-grid">
        <aside id="sidebar" class="sidebar" aria-label="Networks and tokens"></aside>

        <section class="simulator-column" aria-label="Phone simulator">
          <div id="phone-stage" class="phone-stage">
            <div id="phone-frame" class="phone-frame"></div>
          </div>
          <div id="device-dock" class="device-dock" role="toolbar" aria-label="Device preview"></div>
        </section>

        <section id="editor-container" class="editor-panel" aria-label="Token JSON editor"></section>
      </div>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
