# Cloudflare Worker: risk-check proxy for the Send window (docs/designs/send-window-plan.md, T9).
# Deployed by Cloudflare Workers Builds from main: build command `npm test`, deploy command `npx wrangler deploy`.
# Nothing in this file is secret. Secrets (set once in the Cloudflare dashboard, Worker > Settings >
# Variables and Secrets, or with `npx wrangler secret put <NAME>`): AEGIS_API_KEY and RISK_ENABLED.
# RISK_ENABLED is deliberately a secret, not a var: Git deploys overwrite dashboard variables but keep
# secrets (plan E5). Live checks run only when it equals "true". Local development reads worker/.dev.vars.
name = "canvas-wallet"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Stay on the Cloudflare Free plan (see CONTRIBUTING.md, "Free-plan budget"): no routes, no paid add-ons.
# Request logs are not stored (Workers Logs would be one more quota); `wrangler tail` still works live.
[observability]
enabled = false

[vars]
# Exact browser origins allowed to call the Worker (comma-separated; GitHub Pages origin has no path).
ALLOWED_ORIGIN = "https://maslovsa.github.io,http://localhost:5173,http://127.0.0.1:5173" # the site, and a local `npm run dev`
AEGIS_BASE_URL = "https://api.aegis-kyt.com"
# Abuse limits (plan R4 / E3): live Aegis calls per day for the whole demo, and per visitor per hour.
DAILY_BUDGET = "100"
PER_VISITOR_PER_HOUR = "10"

# Verdict cache (a verdict is kept 24 h, a failed check 60 s).
[[kv_namespaces]]
binding = "RISK_CACHE"
id = "6276ef3e24c642cb8e10e1915e85d747"

# Atomic counters for the limits. The Free plan only offers SQLite-backed Durable Objects.
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "RiskCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RiskCounter"]
