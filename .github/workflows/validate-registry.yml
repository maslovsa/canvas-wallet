name: Validate registry

# CI-enforced schema gate — the actual security control behind this project's
# "PR-gated review" thesis (see docs/designs/token-ui-studio.md). Runs on
# EVERY pull request (no path filter: a code-only PR must run the tests too,
# plan decision E1); never on pushes to the default branch directly (see
# deploy.yml for the separate, merge-only deploy workflow — CEO review
# Section 9 finding: deploy and validate must never share a trigger).
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run validate:fixtures
      - run: npx tsc -b
      - run: npm test
