name: Deploy to GitHub Pages

# Deliberately scoped to push-on-default-branch ONLY, never pull_request —
# CEO review Section 9 finding: an unreviewed config must never reach the
# live site via a misconfigured PR-preview deploy trigger. Validation
# (validate-registry.yml) and deployment (this workflow) are two separate
# workflows with two separate, non-overlapping triggers on purpose.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run validate:fixtures
      # Tests gate the deploy: this repo ships by pushing to main, where no PR check runs (plan E1).
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Public URL of the risk-check Worker (a repo VARIABLE, not a secret). Empty means a seed-only site.
          VITE_RISK_PROXY_URL: ${{ vars.VITE_RISK_PROXY_URL }}
      # The repo is public and dist/ is world-readable: fail the deploy on secret-shaped text (plan R11).
      - run: npm run check:dist
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  smoke-test:
    # Automated post-deploy smoke check — CEO review Section 9 finding.
    # Confirms the live site actually loads after each deploy, rather than
    # silently trusting that "deploy-pages succeeded" means "the app works."
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site returns 200 and serves the app shell
        run: |
          url="${{ needs.deploy.outputs.page_url }}"
          for i in 1 2 3 4 5; do
            status=$(curl -s -o response.html -w "%{http_code}" "$url" || echo "000")
            if [ "$status" = "200" ]; then
              break
            fi
            echo "Attempt $i: got HTTP $status, retrying in 10s..."
            sleep 10
          done
          if [ "$status" != "200" ]; then
            echo "::error::Live site at $url did not return 200 after 5 attempts (last: $status)"
            exit 1
          fi
          if ! grep -q "Token UI Studio" response.html; then
            echo "::error::Live site returned 200 but response body doesn't look like the app shell"
            exit 1
          fi
          echo "Smoke test passed: $url is live and serving the app."
